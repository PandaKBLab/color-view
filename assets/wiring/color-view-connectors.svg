<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="770" viewBox="0 0 1540 770" role="img" aria-labelledby="title desc"><title id="title">Color View external connector pinouts</title><desc id="desc">J1 is a 2.54 mm five-pin header, shown left to right as 5 CS, 4 GND, 3 3V3, 2 SCK, 1 MOSI. J2 is a 0.50 mm five-pin bottom-contact FPC connector, shown left to right as 1 CS, 2 GND, 3 3V3, 4 SCK, 5 MOSI. Both views are from the connector side with the top notch upwards.</desc><rect width="1540" height="770" fill="#fff"/><text x="55" y="65" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#102c43" text-anchor="start">COLOR VIEW / TWO CONNECTION OPTIONS</text><text x="55" y="105" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#50687c" text-anchor="start">REAR PCB VIEW  |  CONNECTORS FACING YOU  |  TOP FPC RELIEF UP</text><rect x="50" y="150" width="700" height="410" rx="14" fill="#f5f8fb" stroke="#d6e1e9" stroke-width="1.5"/><rect x="790" y="150" width="700" height="410" rx="14" fill="#f5f8fb" stroke="#d6e1e9" stroke-width="1.5"/><text x="80" y="192" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#17334c" text-anchor="start">J1 / 5PIN HEADER</text><text x="80" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60788b" text-anchor="start">1 x 5 contacts / 2.54 mm pitch</text><rect x="91" y="288" width="600" height="100" rx="5" fill="#dbe6ee" stroke="#58768b" stroke-width="1.5"/><text x="151" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">5</text><circle cx="151" cy="338" r="24" fill="#fff" stroke="#58768b" stroke-width="2"/><text x="151" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">CS</text><text x="271" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">4</text><rect x="247" y="314" width="48" height="48" rx="0" fill="#fff" stroke="#58768b" stroke-width="2"/><text x="271" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">GND</text><text x="391" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">3</text><circle cx="391" cy="338" r="24" fill="#fff" stroke="#58768b" stroke-width="2"/><text x="391" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">VCC</text><text x="511" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">2</text><circle cx="511" cy="338" r="24" fill="#fff" stroke="#58768b" stroke-width="2"/><text x="511" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">SCK</text><text x="631" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">1</text><circle cx="631" cy="338" r="24" fill="#fff" stroke="#58768b" stroke-width="2"/><text x="631" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">MOSI</text><polygon points="631,294 620,279 642,279" fill="#d45b40" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="80" y="510" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#17334c" text-anchor="start">Pin 1 = MOSI. Pin 4 = GND (square pad).</text><text x="820" y="192" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#17334c" text-anchor="start">J2 / 5PIN FPC</text><text x="820" y="225" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#60788b" text-anchor="start">5 contacts / 0.50 mm pitch / bottom contact</text><rect x="832" y="305" width="600" height="83" rx="5" fill="#dbe6ee" stroke="#58768b" stroke-width="1.5"/><text x="892" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">1</text><rect x="878" y="293" width="28" height="60" rx="0" fill="#d3ae5c" stroke="#9e7b33" stroke-width="1"/><text x="892" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">CS</text><text x="1012" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">2</text><rect x="998" y="293" width="28" height="60" rx="0" fill="#d3ae5c" stroke="#9e7b33" stroke-width="1"/><text x="1012" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">GND</text><text x="1132" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">3</text><rect x="1118" y="293" width="28" height="60" rx="0" fill="#d3ae5c" stroke="#9e7b33" stroke-width="1"/><text x="1132" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">VCC</text><text x="1252" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">4</text><rect x="1238" y="293" width="28" height="60" rx="0" fill="#d3ae5c" stroke="#9e7b33" stroke-width="1"/><text x="1252" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">SCK</text><text x="1372" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#24445d" text-anchor="middle">5</text><rect x="1358" y="293" width="28" height="60" rx="0" fill="#d3ae5c" stroke="#9e7b33" stroke-width="1"/><text x="1372" y="439" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17334c" text-anchor="middle">MOSI</text><polygon points="892,294 881,279 903,279" fill="#d45b40" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="845" y="374" width="574" height="15" rx="0" fill="#4e6477" stroke="none" stroke-width="1"/><text x="820" y="510" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#17334c" text-anchor="start">Pin 1 = CS. Cable contact thickness: 0.30 mm.</text><text x="55" y="607" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17334c" text-anchor="start">VCC: regulated 3.3 V or 5 V  |  LOGIC: 3.3 V  |  SPI Mode 0, 500 kHz reference  |  CS active high  |  No MISO</text><text x="55" y="649" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#50687c" text-anchor="start">Use J1 OR J2 as the keyboard input. Both carry the same five signals; their pin numbering differs.</text><text x="55" y="687" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#50687c" text-anchor="start">These are rear PCB / solder-pad views, not a view into the FPC slot. Verify cable contact orientation at both ends.</text><text x="55" y="726" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#50687c" text-anchor="start">Illustrations are enlarged and schematic. Use connector-specific land patterns for keyboard PCB design.</text></svg>
